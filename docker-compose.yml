services:
  investigator:
    build: .
    command: python app/main.py app/sample_traces/hallucination.json
    env_file: .env.example
    volumes:
      - .:/app

  dashboard:
    build: .
    command: streamlit run dashboard/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file: .env.example
    volumes:
      - .:/app
    depends_on:
      - investigator

  airflow:
    image: apache/airflow:2.9.3-python3.11
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/project

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
